name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Verify npm release-age policy
        run: |
          node --version
          npm --version
          test "$(npm config get min-release-age)" = "7"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
