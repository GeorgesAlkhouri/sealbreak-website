name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Inspect npm advisory details (temporary)
        run: |
          npm audit --json > /tmp/sealbreak-npm-audit.json || true
          jq -c '{summary:.metadata.vulnerabilities,issues:[.vulnerabilities | to_entries[] | {name:.key,severity:.value.severity,isDirect:.value.isDirect,range:.value.range,via:(.value.via | map(if type == "string" then . else {title:.title,url:.url,range:.range} end)),fixAvailable:.value.fixAvailable}]}' /tmp/sealbreak-npm-audit.json

      - name: Build
        run: npm run build
