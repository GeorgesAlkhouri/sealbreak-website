name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false

      # Cloudflare Workers Builds uses the exact npm version from
      # package.json#packageManager. Use the same version here.
      - name: Set up npm
        run: |
          NPM_SPEC="$(node -p "require('./package.json').packageManager")"
          case "$NPM_SPEC" in
            npm@[0-9]*) ;;
            *) echo "packageManager must be an exact npm version, got: $NPM_SPEC" >&2; exit 1 ;;
          esac
          npm install -g "$NPM_SPEC"
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
